name: Build & Publish Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (leave blank to auto-use v<versionName> from app/build.gradle.kts)'
        required: false
        default: ''
      prerelease:
        description: 'Mark release as pre-release'
        type: boolean
        required: false
        default: false
      skip_tests:
        description: 'Skip unit tests (checked by default; uncheck on manual run to execute unit tests)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx5120m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
    -Dkotlin.daemon.jvm.options=-Xmx2048m

jobs:
  unit-tests:
    name: Unit Tests (:spotify, :innertube, :app)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.skip_tests }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Robolectric & Maven artifacts
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-m2-robolectric-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Prepare debug signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="${{ github.workspace }}/debug.keystore"
          BASE64_PATH="${{ github.workspace }}/debug.keystore.base64"
          SECRET_B64="${SIGNING_KEYSTORE_BASE64:-${DEBUG_KEYSTORE_BASE64:-}}"
          if [ -n "$SECRET_B64" ]; then
            printf '%s' "$SECRET_B64" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_PATH"
          elif [ ! -f "$KEYSTORE_PATH" ] && [ -f "$BASE64_PATH" ]; then
            tr -d '\r\n ' < "$BASE64_PATH" | base64 -d > "$KEYSTORE_PATH" || rm -f "$KEYSTORE_PATH"
          fi
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkey -v -keystore "$KEYSTORE_PATH" -alias androiddebugkey \
              -keypass android -storepass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests across all modules
        run: |
          chmod +x gradlew
          ./gradlew :spotify:test :innertube:testDebugUnitTest :app:testDebugUnitTest \
            --no-daemon --parallel --build-cache --max-workers=4 --console=plain

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports
          retention-days: 7
          path: |
            spotify/build/reports/tests/
            innertube/build/reports/tests/
            app/build/reports/tests/

  build-release-apk:
    name: Build & Verify Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      release_tag: ${{ steps.package.outputs.release_tag }}
      version_name: ${{ steps.package.outputs.version_name }}
      version_code: ${{ steps.package.outputs.version_code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Prepare release signing keystore
        id: keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="${{ github.workspace }}/debug.keystore"
          BASE64_PATH="${{ github.workspace }}/debug.keystore.base64"
          SIGNING_SOURCE=""
          SECRET_B64="${SIGNING_KEYSTORE_BASE64:-${DEBUG_KEYSTORE_BASE64:-}}"

          if [ -n "$SECRET_B64" ]; then
            echo "Decoding signing keystore from GitHub Actions secret..."
            printf '%s' "$SECRET_B64" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_PATH"
            SIGNING_SOURCE="github-secret"
          elif [ -f "$KEYSTORE_PATH" ]; then
            echo "Using existing debug.keystore from workspace..."
            SIGNING_SOURCE="workspace-keystore"
          elif [ -f "$BASE64_PATH" ]; then
            echo "Decoding committed debug.keystore.base64..."
            if tr -d '\r\n ' < "$BASE64_PATH" | base64 -d > "$KEYSTORE_PATH" && [ -s "$KEYSTORE_PATH" ]; then
              SIGNING_SOURCE="repo-base64"
            else
              echo "::warning::debug.keystore.base64 failed to decode cleanly."
              rm -f "$KEYSTORE_PATH"
            fi
          fi

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret or debug.keystore.base64 found! Generating an ephemeral one-time keystore — Android will block in-place updates with 'Signing key mismatch' across separate CI builds."
            keytool -genkey -v -keystore "$KEYSTORE_PATH" -alias androiddebugkey \
              -keypass android -storepass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            SIGNING_SOURCE="ephemeral"
          fi

          CERT_SHA256=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass android -alias androiddebugkey \
            | grep -oE 'SHA256:[[:space:]]*[0-9A-Fa-f:]+' | head -n1 | awk '{print $2}')
          CERT_SHORT=$(printf '%s' "${CERT_SHA256:-unknown}" | tr -d ':' | tr '[:upper:]' '[:lower:]' | cut -c1-10)
          echo "Signing source: ${SIGNING_SOURCE} | Certificate SHA-256: ${CERT_SHA256} (SpotUI ID: ${CERT_SHORT}…)"
          ls -lh "$KEYSTORE_PATH"

          echo "signing_source=${SIGNING_SOURCE}" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=${CERT_SHA256}" >> "$GITHUB_OUTPUT"
          echo "cert_short=${CERT_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Assemble Release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            --no-daemon --parallel --build-cache --max-workers=4 --console=plain

      - name: Verify APK signature, package & checksum
        id: package
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -n1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TAG_NAME="${{ inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v${VERSION_NAME}"
          fi

          RAW_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RAW_APK" ]; then
            echo "Error: Release APK not found at $RAW_APK" >&2
            exit 1
          fi

          APKSIGNER=$(ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1 || true)
          SIGNER_INFO="apksigner not found on runner (skipped)"
          APK_CERT_SHA256="${{ steps.keystore.outputs.cert_sha256 }}"
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$RAW_APK"
            SIGNER_INFO=$("$APKSIGNER" verify --print-certs "$RAW_APK" | head -n 6)
            EXTRACTED_DIGEST=$("$APKSIGNER" verify --print-certs "$RAW_APK" | sed -n 's/.*SHA-256 digest:[[:space:]]*//p' | head -n1 || true)
            if [ -n "$EXTRACTED_DIGEST" ]; then
              APK_CERT_SHA256="$EXTRACTED_DIGEST"
            fi
          fi
          APK_CERT_SHORT=$(printf '%s' "${APK_CERT_SHA256:-unknown}" | tr -d ':' | tr '[:upper:]' '[:lower:]' | cut -c1-10)
          SIGNING_SOURCE="${{ steps.keystore.outputs.signing_source }}"

          mkdir -p dist
          APK_NAME="SpotUI-v${VERSION_NAME}-release.apk"
          cp "$RAW_APK" "dist/${APK_NAME}"
          (cd dist && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")
          SHA256_HASH=$(cut -d' ' -f1 "dist/${APK_NAME}.sha256")
          APK_SIZE=$(du -h "dist/${APK_NAME}" | cut -f1)

          echo "release_tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

          {
            echo "### Download & Integrity"
            echo "- **APK:** \`${APK_NAME}\` (${APK_SIZE})"
            echo "- **APK SHA-256:** \`${SHA256_HASH}\`"
            echo "- **Signing Key ID:** \`${APK_CERT_SHORT}…\` (\`${SIGNING_SOURCE}\`)"
            if [ "$SIGNING_SOURCE" = "ephemeral" ]; then
              echo ""
              echo "> **Note:** Built with a one-off ephemeral key because neither \`SIGNING_KEYSTORE_BASE64\` secret nor \`debug.keystore.base64\` was present. If you see \`Signing key mismatch\` updating in-app, back up settings, uninstall the old build, and install this APK (then add \`SIGNING_KEYSTORE_BASE64\` or commit \`debug.keystore.base64\` so future releases update in-place)."
            fi
            echo ""
          } > dist/release-notes-header.md

          {
            echo "## SpotUI Release Build Summary"
            if [ "$SIGNING_SOURCE" = "ephemeral" ]; then
              echo "> **WARNING:** Built with an **ephemeral** keystore! Add \`SIGNING_KEYSTORE_BASE64\` in Repository Secrets or commit \`debug.keystore.base64\` so future GitHub Releases don't trigger \`Signing key mismatch\` in the in-app updater."
              echo ""
            fi
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Version | \`v${VERSION_NAME}\` (\`${VERSION_CODE}\`) |"
            echo "| Release Tag | \`${TAG_NAME}\` |"
            echo "| APK File | \`${APK_NAME}\` (${APK_SIZE}) |"
            echo "| APK SHA-256 | \`${SHA256_HASH}\` |"
            echo "| Signing Source | \`${SIGNING_SOURCE}\` |"
            echo "| Signing Key ID | \`${APK_CERT_SHORT}…\` (\`${APK_CERT_SHA256}\`) |"
            echo ""
            echo "<details><summary>APK Signing Details</summary>"
            echo ""
            echo "\`\`\`"
            echo "${SIGNER_INFO}"
            echo "\`\`\`"
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v6
        with:
          name: SpotUI-release-apk
          retention-days: 30
          path: |
            dist/*.apk
            dist/*.sha256
            dist/release-notes-header.md

  publish-release:
    name: Publish GitHub Release
    needs: [unit-tests, build-release-apk]
    if: >-
      always() &&
      needs.build-release-apk.result == 'success' &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download packaged APK artifacts
        uses: actions/download-artifact@v5
        with:
          name: SpotUI-release-apk
          path: dist

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-release-apk.outputs.release_tag }}
          name: SpotUI ${{ needs.build-release-apk.outputs.release_tag }}
          prerelease: ${{ inputs.prerelease == true }}
          body_path: dist/release-notes-header.md
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.sha256
